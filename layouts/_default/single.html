{{ define "main" }}
<article class="article">
  <div class="wrap">
    <header class="article__head">
      <nav class="breadcrumb" aria-label="Fil d'Ariane">
        <a href="{{ "/" | relURL }}">Accueil</a> &nbsp;›&nbsp; {{ .Title }}
      </nav>
      <h1>{{ .Title }}</h1>
      {{ with .Params.lede }}<p class="article__lede">{{ . }}</p>{{ end }}
    </header>

    <div class="prose">
      {{ .Content }}
    </div>
  </div>
</article>
{{ end }}
