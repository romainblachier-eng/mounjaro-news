baseURL = "https://mounjaronews.info/"
languageCode = "fr-FR"
defaultContentLanguage = "fr"
title = "Mounjaro News"
enableRobotsTXT = true
summaryLength = 40

[pagination]
  pagerSize = 24

[params]
  tagline          = "L'actualité du tirzépatide"
  description      = "Toute l'actualité du Mounjaro (tirzépatide) : veille quotidienne des sources médicales et de la presse internationale, en français."
  author           = "Mounjaro News"
  email            = "romain.blachier@gmail.com"
  beehiiv_embed_url = "https://subscribe-forms.beehiiv.com/91587c2f-9b1e-45e3-95cf-1f8ca0fe3c4b"
  adsense_publisher = "ca-pub-4796217302525352"
  google_site_verification = "i4BFwUFN_m_FBnjx-mbnwyeurPoRtZy5iCTciCOFGsM"
  keywords         = "Mounjaro, tirzépatide, GLP-1, perte de poids, diabète de type 2, obésité, Eli Lilly, actualités Mounjaro"
  disclaimer       = "Ce site propose une revue de presse à visée informative. Il ne délivre aucun conseil médical et ne remplace pas l'avis d'un professionnel de santé."

[menus]
  [[menus.main]]
    name = "À la une"
    url = "/"
    weight = 10
  [[menus.main]]
    name = "Tous les articles"
    url = "/posts/"
    weight = 20
  [[menus.main]]
    name = "Newsletter"
    url = "/#newsletter"
    weight = 30

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 4

[outputs]
  home    = ["HTML", "RSS", "JSON"]
  page    = ["HTML"]
  section = ["HTML", "RSS"]

[sitemap]
  changefreq = "daily"
  filename   = "sitemap.xml"
  priority   = 0.8

[minify]
  minifyOutput = true
